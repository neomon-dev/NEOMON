version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: neomon-postgres-dev
    environment:
      POSTGRES_DB: neomon_dev
      POSTGRES_USER: neomon
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: neomon-redis-dev
    ports:
      - "6379:6379"

volumes:
  postgres_dev_data:
