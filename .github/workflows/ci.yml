name: NEOMON CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test & Quality Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.12" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Syntax & Compilation Check
        run: |
          python -m compileall backend/app

      - name: Run Alembic Database Migrations
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Run Automated Pytest Suite
        env:
          NEOMON_ENVIRONMENT: test
          PYTHONPATH: backend
        run: |
          python -m pytest backend/tests -v --durations=10

  frontend-test:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ "20.x" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: ESLint Check
        run: npm run lint

      - name: TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: Run Frontend Tests
        run: npm test --if-present

      - name: Build Next.js Production Assets
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

  docker-validation:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
